experiment_name: dev_smoke
output_dir: outputs/dev_smoke

dataset:
  name: breast_cancer
  positive_label: malignant

splitting:
  outer_splits: 2
  test_size: 0.2
  inner_folds: 2
  seeds: [0, 1]

metrics:
  - accuracy
  - balanced_accuracy
  - roc_auc
  - f1
  - recall_positive

models:
  - name: quantum_kernel_smoke
    type: quantum_kernel_svm
    preprocessing:
      n_components: [4]
      angle_range: [-3.141592653589793, 3.141592653589793]
    quantum:
      encoding: [angle_y]
      depth: [1]
      alpha: [1.0]
    params:
      C: [1.0]

